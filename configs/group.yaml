# tag_groups.json 生成配置（一次性离线产物，03_group_tags.py 消费）。
# 用最强模型 + 默认思考：分组定义进每个标注 prompt，是质量关键 artifact，
# 成本一次性（~12 批 × 100 tag）。运行（服务器，需先 source server-env.sh）：
#   .venv/bin/python scripts/03_group_tags.py --config configs/group.yaml --batch-size 100
# 注意：重生成会改变组结构 → 所有标注 prompt 变化 → 旧标注缓存全部失效（刻意行为）。
exp_name: group
data: {source: real, seed: 42}
model:
  model: qwen3.8-max
  temperature: 0.7
  request_interval: 0.2
mock: false
