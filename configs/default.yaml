exp_name: default
data:
  source: real
  movie_limit: null
  seed: 42
model:
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  model: qwen3.5-4b
  temperature: 0.7
  max_frames: 4
  script_token_budget: 400
  dialogue_token_budget: 250
  request_interval: 0.1
annotation:
  n_runs: 3
  modalities: [video, script, dialogue]
  few_shot_examples: 2
protocol:
  temporal_split_year: 2022
  relevance_threshold: 0.5
  top_k: 10
  cold_start_max_tags: 0
baselines:
  run: [random, mean, genre, bert]
mock: false
