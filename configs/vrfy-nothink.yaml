# 与 vrfy 完全同构，唯一差异：extra_body 关闭思考（enable_thinking: false）——
# 量化思考模式对标注质量/延迟/成本的影响（实测单任务 12s vs 32s，思考 token 占输出 ~60%）
exp_name: vrfy-nothink
data: {source: real, movie_limit: 2, seed: 42}
model:
  model: qwen3.7-plus
  temperature: 0.7
  max_frames: 4
  script_token_budget: 400
  dialogue_token_budget: 250
  request_interval: 0.1
  extra_body: {enable_thinking: false}
annotation:
  n_runs: 1
  modalities: [video, script, dialogue]
  few_shot_examples: 2
protocol: {temporal_split_year: 2022, relevance_threshold: 0.5, top_k: 10}
mock: false
