# 首次真实试跑：50 部电影 × 3 轮——验证 prompt 有效性与成本后再放量
exp_name: pilot
data: {source: real, movie_limit: 50, seed: 42}
model:
  model: qwen3.7-plus
  temperature: 0.7
  max_frames: 12
  script_token_budget: 4000
  dialogue_token_budget: 3000
  request_interval: 0.1
annotation:
  n_runs: 3
  modalities: [video, script, dialogue]
  few_shot_examples: 2
protocol: {temporal_split_year: 2015, relevance_threshold: 0.5, top_k: 10}
mock: false
